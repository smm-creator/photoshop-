<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Import Raster Layers</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js"></script>
</head>
<body>
  <h1>Import Raster</h1>
  <p class="hint">
    Active document = master PSD. Files open as documents, then duplicate as
    <strong>normal pixel layers</strong> — never Place / Smart Object.
  </p>

  <label class="field">
    Import mode
    <select id="importMode">
      <option value="merged" selected>Merged image → one layer</option>
      <option value="topPixel">Top / active pixel layer</option>
    </select>
  </label>

  <label class="check">
    <input type="checkbox" id="putIntoImportGroup" checked />
    Put layers into group <code>IMPORT</code>
  </label>

  <label class="check">
    <input type="checkbox" id="stripExtension" checked />
    Strip file extension from layer name
  </label>

  <button id="btnImport" class="cta">Choose files &amp; import</button>
  <pre id="log" class="log"></pre>
</body>
</html>
